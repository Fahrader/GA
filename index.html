
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Strona</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <span class="text-lg font-semibold tracking-tight text-white">Projekt GA</span>
            <a href="#contact" class="text-sm font-medium bg-white text-slate-950 px-4 py-2 rounded-lg hover:bg-slate-200 transition-colors">Kontakt</a>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="max-w-5xl mx-auto px-6 py-24 flex-1 flex flex-col justify-center">
        <div class="max-w-2xl space-y-6">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-slate-800 bg-slate-900 text-xs text-slate-400">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Zaprojektowano z Taste Skill
            </div>
            <h1 class="text-4xl sm:text-6xl font-bold tracking-tight text-white leading-tight">
                Nowoczesny wygląd strony bez zbędnego chaosu.
            </h1>
            <p class="text-lg text-slate-400 leading-relaxed">
                Minimalistyczny układ, dopracowana typografia i czytelny interfejs. Kod oparty na sprawdzonych zasadach projektowania UI.
            </p>
            <div class="pt-4 flex items-center gap-4">
                <a href="#contact" class="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition-all shadow-lg shadow-indigo-600/20">Sprawdź więcej</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-8 bg-slate-900/30">
        <div class="max-w-5xl mx-auto px-6 text-center text-xs text-slate-500">
            © 2026 GA. Wszystkie prawa zastrzeżone.
        </div>
    </footer>

</body>
</html>
